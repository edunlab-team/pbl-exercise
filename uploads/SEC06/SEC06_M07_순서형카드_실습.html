<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEC06 M7 순서형 카드 실습</title><style>body{font:17px/1.7 system-ui;max-width:850px;margin:auto;padding:24px}button{padding:12px;margin:8px}textarea{width:95%;min-height:140px}#card{padding:20px;background:#eef4f7}small{display:block}</style><h1>SEC06 M7 순서형 카드 실습</h1><p>조건 카드에는 후속 측정 결과가 없습니다. 확인 가능한 내용·미확인·필요 자료를 직접 적습니다. 응답을 저장해야 다음 카드가 공개됩니다. 데이터는 브라우저 메모리에만 남으므로 종료 전에 다운로드합니다.</p><button id="start">시작/새 회차</button><h2 id="status">시작 전</h2><div id="card">시작을 누르세요.</div><label for="answer">본인 판단·근거·추가 확인할 자료</label><textarea id="answer"></textarea><button id="next" disabled>응답 저장·다음 카드</button><button id="download">기록 다운로드</button><small>카드 공개 시각은 행동 완료나 물리적 측정 결과가 아닙니다. 미래 카드가 코드 안에 있는 교육용 도구이며 보안 시험 도구가 아닙니다.</small><script>
const cards=[["T1", "관측 등급 L1 기준 모의 관측(기준선)", "배치별 식별 시간 기록"], ["T2", "관측 등급 L2로 상향", "위장막 접합부 노출 여부"], ["T3", "관측 등급 L3로 상향, 기만체 노후 흔적 표시", "기만체 오인 감소 여부"], ["T4", "야간 관측 모의로 전환", "차폐 성능 관측 등급 변화"], ["T5", "기상 변화(비) 카드", "기록 조건 기재 여부"], ["T6", "관측팀 교대(새 기록자)", "판정 기준 일관성"]];let index=-1,log=[],started=null;const el=id=>document.getElementById(id);const now=()=>new Date().toISOString();
function show(){const c=cards[index];el('status').textContent=c[0]+' / '+cards.length;el('card').textContent=c[1]+' — 확인 질문: '+c[2]+'〔결과값 미제공〕';el('answer').value='';log.push({card:c[0],revealedAt:now(),content:c[1],question:c[2]});}
el('start').onclick=()=>{if(log.length&&!confirm('이전 기록을 다운로드했나요? 새 회차는 현재 기록을 지웁니다.'))return;index=0;log=[];started=now();el('next').disabled=false;show();};
el('next').onclick=()=>{if(index<0||index>=cards.length)return;const a=el('answer').value.trim();if(!a){alert('본인 판단·근거·필요 자료를 입력하세요.');return;}log[log.length-1].response=a;log[log.length-1].respondedAt=now();index++;if(index===cards.length){el('status').textContent='6개 카드 응답 저장 완료';el('card').textContent='기록을 다운로드해 forms와 실제 AI 대화에 연결하세요. 이 표시는 효과 소멸 판정이나 평가 PASS가 아닙니다.';el('next').disabled=true;}else show();};
el('download').onclick=()=>{const b=new Blob([JSON.stringify({project:'SEC06',started,exportedAt:now(),log,measurementResults:'원본 미제공'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='SEC06_M07_실습기록.json';a.click();URL.revokeObjectURL(a.href);};
</script></html>
